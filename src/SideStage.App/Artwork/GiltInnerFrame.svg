  </defs>
  <g id="side-rails" fill="none" stroke="#B69B70" stroke-width="2.4" stroke-linecap="round">
    <path d="M15 28V626M609 28V626"/>
  </g>
  <g id="horizontal-rails">
    <use xlink:href="#end-rail"/>
    <use xlink:href="#end-rail" transform="translate(0 654) scale(1 -1)"/>
  </g>
  <g id="corners">
    <use xlink:href="#corner-mark"/>
    <use xlink:href="#corner-mark" transform="translate(624 0) scale(-1 1)"/>
    <use xlink:href="#corner-mark" transform="translate(0 654) scale(1 -1)"/>
    <use xlink:href="#corner-mark" transform="translate(624 654) scale(-1 -1)"/>
  </g>
