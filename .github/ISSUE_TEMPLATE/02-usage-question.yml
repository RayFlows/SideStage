# 收集使用求助的目标、卡住的步骤和已尝试的操作。
name: 使用求助
description: 询问如何安装、连接或使用 SideStage。
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        提交前可以先查看 README 的[使用方法](https://github.com/RayFlows/SideStage#使用方法)和 [Q&A](https://github.com/RayFlows/SideStage#qa)，也可以[搜索现有 Issue](https://github.com/RayFlows/SideStage/issues?q=is%3Aissue)。
  - type: textarea
    id: goal
    attributes:
      label: 想做什么？
      placeholder: 例如断开 SideStage 后保留子会话中的程序。
    validations:
      required: true
  - type: textarea
    id: stuck
    attributes:
      label: 卡在哪一步？
      description: 可以写出点击的按钮，以及看到的界面或提示。
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: 已经试过什么？
      description: 简单写出试过的方法和结果，也可以填「暂未尝试」。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: SideStage 和 Windows 版本
      placeholder: 例如 SideStage v0.1.0-beta.7，Windows 11 24H2 专业版
  - type: textarea
    id: details
    attributes:
      label: 截图或报错
      description: 提交前请遮盖用户名、设备名、密码、PIN 和其他敏感信息。
